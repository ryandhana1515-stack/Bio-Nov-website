<script type="module">
import * as THREE from 'three';

const W = 1600, H = 900;          // output size
const RW = 2400, RH = 1350;       // supersampled render size (SwiftShader has no MSAA)
const GOLD = 0xc9a227, GOLD_BRIGHT = 0xe8c766;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(RW, RH);
renderer.setPixelRatio(1);
const outCanvas = document.createElement('canvas');
outCanvas.width = W; outCanvas.height = H;
const outCtx = outCanvas.getContext('2d');
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030303);

const camera = new THREE.PerspectiveCamera(35, W / H, 0.05, 100);

/* ---------- studio environment: black room with thin light strips ---------- */
function buildEnv() {
  const env = new THREE.Scene();
  env.background = new THREE.Color(0x000000);
  const strip = (w, h, x, y, z, ry, rx, color, intensity) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide })
    );
    m.material.color.multiplyScalar(intensity);
    m.position.set(x, y, z);
    m.rotation.set(rx, ry, 0);
    env.add(m);
  };
  // long horizontal softbox above
  strip(14, 2.6, 0, 6, 0, 0, Math.PI / 2.6, 0xfff4e0, 7.0);
  // warm gold strip camera-left rear
  strip(2.2, 12, -7, 0, -3, Math.PI / 2.3, 0, 0xffdf9e, 5.5);
  // cool white strip camera-right rear
  strip(1.8, 12, 7, 0, -3, -Math.PI / 2.3, 0, 0xe8edff, 6.5);
  // front fill card (lifts the dial and case front)
  strip(9, 5, 0, 0.5, 9, Math.PI, 0, 0x555a66, 2.4);
  // low warm bounce card beneath (champagne uplight on the case flanks)
  strip(10, 3, 0, -5.5, 2, 0, -Math.PI / 2.4, 0xffe2ae, 1.4);
  const pm = new THREE.PMREMGenerator(renderer);
  const tex = pm.fromScene(env, 0.04).texture;
  pm.dispose();
  return tex;
}
scene.environment = buildEnv();

/* rim + key lights (specular kicks beyond the envmap) */
const rimL = new THREE.DirectionalLight(0xffe3a3, 4.4); rimL.position.set(-6, 2.5, -4); scene.add(rimL);
const rimR = new THREE.DirectionalLight(0xd8e0ff, 4.6); rimR.position.set(6.5, 3, -3.5); scene.add(rimR);
const key  = new THREE.DirectionalLight(0xfff2dd, 2.2); key.position.set(2, 5, 6); scene.add(key);
scene.add(new THREE.AmbientLight(0x5a5648, 0.9));

/* ---------- materials ---------- */
const M = {
  titanium: new THREE.MeshPhysicalMaterial({ color: 0x34353c, metalness: 0.92, roughness: 0.38, envMapIntensity: 1.3 }),
  titaniumPolished: new THREE.MeshPhysicalMaterial({ color: 0x585a63, metalness: 0.96, roughness: 0.10, envMapIntensity: 2.4 }),
  gold: new THREE.MeshPhysicalMaterial({ color: GOLD, metalness: 1.0, roughness: 0.18, envMapIntensity: 2.1 }),
  goldPolished: new THREE.MeshPhysicalMaterial({ color: GOLD_BRIGHT, metalness: 1.0, roughness: 0.08, envMapIntensity: 2.6 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xaec2d8, metalness: 1.0, roughness: 0.03, transparent: true, opacity: 0.08, envMapIntensity: 2.8, side: THREE.DoubleSide, depthWrite: false }),
  strap: new THREE.MeshPhysicalMaterial({ color: 0x141417, metalness: 0.05, roughness: 0.68, envMapIntensity: 0.55 }),
  steelDark: new THREE.MeshPhysicalMaterial({ color: 0x565660, metalness: 0.9, roughness: 0.24, envMapIntensity: 1.8 }),
  titaniumDark: new THREE.MeshPhysicalMaterial({ color: 0x0b0b0d, metalness: 0.1, roughness: 0.92, envMapIntensity: 0.25 }),
};

/* ---------- dial texture (sunburst + print) ---------- */
function dialTexture() {
  const S = 2048, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d'); const cx = S / 2, cy = S / 2;
  x.fillStyle = '#1c1c22'; x.fillRect(0, 0, S, S);
  // sunburst brushed rays
  for (let i = 0; i < 2400; i++) {
    const a = (i / 2400) * Math.PI * 2 + (i % 7) * 0.0007;
    const l = 0.86 + Math.sin(i * 12.9898) * 0.06;
    const g = 34 + Math.floor(Math.abs(Math.sin(i * 78.233)) * 24);
    x.strokeStyle = `rgba(${g + 8},${g + 6},${g + 14},0.5)`;
    x.lineWidth = 1.2;
    x.beginPath(); x.moveTo(cx, cy);
    x.lineTo(cx + Math.cos(a) * S * 0.5 * l, cy + Math.sin(a) * S * 0.5 * l);
    x.stroke();
  }
  // radial sheen gradient
  const grad = x.createRadialGradient(cx - 300, cy - 340, 100, cx, cy, S * 0.55);
  grad.addColorStop(0, 'rgba(120,116,110,0.5)'); grad.addColorStop(0.5, 'rgba(40,38,34,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.4)');
  x.fillStyle = grad; x.fillRect(0, 0, S, S);
  // minute track
  x.save(); x.translate(cx, cy);
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2;
    const long = i % 5 === 0;
    x.strokeStyle = long ? 'rgba(212,175,55,0.95)' : 'rgba(190,190,200,0.55)';
    x.lineWidth = long ? 7 : 3;
    x.beginPath();
    const r0 = S * 0.455, r1 = S * (long ? 0.435 : 0.443);
    x.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
    x.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
    x.stroke();
  }
  x.restore();
  // brand print
  x.fillStyle = 'rgba(226,196,116,0.96)';
  x.textAlign = 'center';
  x.font = `600 ${S * 0.032}px Georgia, serif`;
  x.fillText('AURUM & NOIR', cx, cy - S * 0.155);
  x.font = `400 ${S * 0.0165}px Georgia, serif`;
  x.fillStyle = 'rgba(200,200,210,0.8)';
  x.letterSpacing = '14px';
  x.fillText('G E N È V E', cx, cy - S * 0.118);
  x.font = `400 ${S * 0.014}px Georgia, serif`;
  x.fillStyle = 'rgba(226,196,116,0.85)';
  x.fillText('TOURBILLON', cx, cy + S * 0.205 - S * 0.155); // above aperture
  // subdial recesses at 3 and 9 (painted rings, hands are 3D)
  const sub = (sx) => {
    x.save(); x.translate(cx + sx, cy);
    const r = S * 0.105;
    const g2 = x.createRadialGradient(0, 0, r * 0.1, 0, 0, r);
    g2.addColorStop(0, '#1c1c20'); g2.addColorStop(1, '#0b0b0d');
    x.fillStyle = g2; x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); x.fill();
    x.strokeStyle = 'rgba(212,175,55,0.8)'; x.lineWidth = 4;
    x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); x.stroke();
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      x.strokeStyle = 'rgba(200,200,210,0.6)'; x.lineWidth = 3;
      x.beginPath();
      x.moveTo(Math.cos(a) * r * 0.82, Math.sin(a) * r * 0.82);
      x.lineTo(Math.cos(a) * r * 0.94, Math.sin(a) * r * 0.94);
      x.stroke();
    }
    x.restore();
  };
  sub(-S * 0.225); sub(S * 0.225);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* ---------- watch construction (face = XY plane, +Z toward viewer, 12 o'clock = +Y) ---------- */
const CASE_R = 2.1;                 // 42 mm
const watchGroup = new THREE.Group();  // turntable / float transforms
scene.add(watchGroup);
const parts = {};                   // named for explosion
const P = (name, obj) => { parts[name] = obj; obj.userData.home = { p: obj.position.clone(), r: obj.rotation.clone() }; watchGroup.add(obj); return obj; };

function latheZ(pointsRZ, mat, segments = 128) {
  const pts = pointsRZ.map(([r, z]) => new THREE.Vector2(r, z));
  const g = new THREE.LatheGeometry(pts, segments);
  const m = new THREE.Mesh(g, mat);
  m.rotation.x = Math.PI / 2;      // lathe axis Y -> Z
  return m;
}

/* case body */
{
  const grp = new THREE.Group();
  const body = latheZ([
    [1.55, -0.52], [1.98, -0.46], [2.10, -0.20], [2.10, 0.22], [2.02, 0.36], [1.86, 0.42],
  ], M.titanium);
  grp.add(body);
  // polished gold chamfer ring (two-tone luxury accent)
  const cham = new THREE.Mesh(new THREE.TorusGeometry(2.06, 0.045, 24, 128), M.goldPolished);
  cham.position.z = 0.30; grp.add(cham);
  // lugs
  for (const sy of [1, -1]) {
    for (const sx of [1, -1]) {
      const lug = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.85, 0.5), M.titaniumDark);
      lug.position.set(sx * 0.78, sy * 2.18, -0.08);
      lug.rotation.x = -sy * 0.28;
      grp.add(lug);
    }
  }
  P('caseBody', grp);
}
/* bezel — polished gold, the signature two-tone stroke */
{
  const bez = latheZ([[1.80, 0.40], [2.02, 0.44], [2.02, 0.58], [1.84, 0.64], [1.74, 0.58]], M.goldPolished);
  P('bezel', bez);
}
/* case back + rotor */
{
  const back = latheZ([[0, -0.62], [1.35, -0.62], [1.62, -0.56], [1.58, -0.48]], M.titanium);
  P('caseBack', back);
  const rotGrp = new THREE.Group();
  const rot = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 0.06, 64, 1, false, 0, Math.PI), M.gold);
  rot.rotation.x = Math.PI / 2; rotGrp.add(rot);
  rotGrp.position.z = -0.40;
  P('rotor', rotGrp);
}
/* movement plate + gears (revealed in explosion) */
{
  const plate = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.10, 64), M.steelDark);
  plate.rotation.x = Math.PI / 2; plate.position.z = -0.10;
  P('movement', plate);

  const mkGear = (r, teeth, thick) => {
    const g = new THREE.Group();
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(r, r, thick, 48), M.gold);
    disc.rotation.x = Math.PI / 2; g.add(disc);
    for (let i = 0; i < teeth; i++) {
      const a = (i / teeth) * Math.PI * 2;
      const tooth = new THREE.Mesh(new THREE.BoxGeometry(r * 0.16, r * 0.14, thick), M.gold);
      tooth.position.set(Math.cos(a) * (r + r * 0.06), Math.sin(a) * (r + r * 0.06), 0);
      tooth.rotation.z = a;
      g.add(tooth);
    }
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.18, r * 0.18, thick * 2.6, 24), M.goldPolished);
    hub.rotation.x = Math.PI / 2; g.add(hub);
    return g;
  };
  const gearSpecs = [
    [0.42, 18, 0.05, 0.55, 0.55, 0.02],
    [0.30, 14, 0.05, -0.62, 0.42, 0.04],
    [0.24, 12, 0.04, -0.30, -0.28, 0.02],
    [0.36, 16, 0.05, 0.62, -0.40, 0.05],
    [0.18, 10, 0.04, 0.05, 0.85, 0.05],
  ];
  gearSpecs.forEach(([r, tth, th, gx, gy, gz], i) => {
    const g = mkGear(r, tth, th);
    g.position.set(gx, gy, gz);
    P('gear' + i, g);
  });
  // mainspring: flat spiral
  {
    const pts = [];
    for (let i = 0; i <= 240; i++) {
      const a = i / 240 * Math.PI * 7;
      const r = 0.08 + (i / 240) * 0.34;
      pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const spring = new THREE.Mesh(new THREE.TubeGeometry(curve, 360, 0.016, 8), M.steelDark);
    spring.position.set(0.05, 0.85, 0.09);
    P('mainspring', spring);
  }
}
/* dial with tourbillon aperture */
const AP = { x: 0, y: -0.95, r: 0.62 };
{
  const DIAL_R = 1.72;
  const shape = new THREE.Shape();
  shape.absarc(0, 0, DIAL_R, 0, Math.PI * 2, false);
  const hole = new THREE.Path();
  hole.absarc(AP.x, AP.y, AP.r, 0, Math.PI * 2, true);
  shape.holes.push(hole);
  const g = new THREE.ShapeGeometry(shape, 96);
  // remap UVs from position
  const uv = g.attributes.uv, pos = g.attributes.position;
  for (let i = 0; i < uv.count; i++) {
    uv.setXY(i, pos.getX(i) / (2 * DIAL_R) + 0.5, pos.getY(i) / (2 * DIAL_R) + 0.5);
  }
  const dialMat = new THREE.MeshStandardMaterial({ map: dialTexture(), metalness: 0.65, roughness: 0.38, envMapIntensity: 1.5 });
  const grp = new THREE.Group();
  const dial = new THREE.Mesh(g, dialMat);
  grp.add(dial);
  // gold aperture surround
  const ring = new THREE.Mesh(new THREE.TorusGeometry(AP.r + 0.015, 0.028, 16, 96), M.goldPolished);
  ring.position.set(AP.x, AP.y, 0.012); grp.add(ring);
  // applied gold indices (skip 3/6/9 zones)
  for (let i = 0; i < 12; i++) {
    if (i === 3 || i === 9 || i === 6) continue;
    const a = Math.PI / 2 - (i / 12) * Math.PI * 2;
    const idx = new THREE.Mesh(new THREE.BoxGeometry(i === 0 ? 0.16 : 0.09, 0.34, 0.05), M.goldPolished);
    idx.position.set(Math.cos(a) * 1.42, Math.sin(a) * 1.42, 0.035);
    idx.rotation.z = a - Math.PI / 2;
    grp.add(idx);
    if (i === 0) { // double index at 12
      idx.position.x -= 0.11;
      const idx2 = idx.clone(); idx2.position.x += 0.22; grp.add(idx2);
    }
  }
  grp.position.z = 0.30;
  P('dial', grp);
}
/* subdial hands (3D, on top of painted subdials) */
{
  const grp = new THREE.Group();
  const mk = (sx, angle) => {
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.36, 0.02), M.goldPolished);
    h.geometry.translate(0, 0.13, 0);
    h.position.set(sx, 0, 0.315 - 0.30);
    h.rotation.z = angle;
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.05, 16), M.goldPolished);
    pin.rotation.x = Math.PI / 2; pin.position.set(sx, 0, 0.02);
    grp.add(h, pin);
  };
  mk(-0.945, 2.4); mk(0.945, -0.9);
  grp.position.z = 0.30;
  parts.dial.add(grp); // rides with dial
}
/* hands — dauphine, 10:08 */
{
  const grp = new THREE.Group();
  const dauphine = (len, wid, thick) => {
    const s = new THREE.Shape();
    s.moveTo(-wid, 0); s.lineTo(0, len); s.lineTo(wid, 0); s.lineTo(0, -len * 0.18); s.closePath();
    const g = new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 2 });
    return new THREE.Mesh(g, M.goldPolished);
  };
  const hour = dauphine(0.92, 0.075, 0.03); hour.rotation.z = -((10 + 8 / 60) / 12) * Math.PI * 2; hour.position.z = 0.40;
  const min = dauphine(1.38, 0.06, 0.03); min.rotation.z = -(8 / 60) * Math.PI * 2; min.position.z = 0.44;
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.10, 24), M.goldPolished);
  pin.rotation.x = Math.PI / 2; pin.position.z = 0.42;
  grp.add(hour, min, pin);
  P('hands', grp);
}
/* tourbillon */
let tourbillonCage;
{
  const grp = new THREE.Group();
  // base wheel
  const base = new THREE.Mesh(new THREE.CylinderGeometry(AP.r - 0.06, AP.r - 0.06, 0.03, 48), M.steelDark);
  base.rotation.x = Math.PI / 2; base.position.z = -0.09; grp.add(base);
  // fixed fourth wheel (gold ring w/ inner teeth feel)
  const fixedRing = new THREE.Mesh(new THREE.TorusGeometry(AP.r - 0.10, 0.02, 12, 72), M.gold);
  fixedRing.position.z = -0.05; grp.add(fixedRing);

  const cage = new THREE.Group();
  // cage arcs
  for (const rz of [0, Math.PI / 2]) {
    const arc = new THREE.Mesh(new THREE.TorusGeometry(0.44, 0.026, 12, 48, Math.PI), M.goldPolished);
    arc.rotation.set(0, Math.PI / 2, 0);
    const holder = new THREE.Group();
    holder.add(arc); holder.rotation.z = rz;
    arc.rotation.y = Math.PI / 2; arc.rotation.z = 0; arc.rotation.x = Math.PI / 2;
    cage.add(holder);
  }
  // balance wheel
  const bal = new THREE.Group();
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.030, 12, 64), M.gold);
  bal.add(rim);
  for (let i = 0; i < 3; i++) {
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.035, 0.025), M.gold);
    spoke.rotation.z = (i / 3) * Math.PI;
    bal.add(spoke);
  }
  bal.position.z = 0.02;
  cage.add(bal);
  cage.userData.balance = bal;
  // hairspring
  {
    const pts = [];
    for (let i = 0; i <= 200; i++) {
      const a = i / 200 * Math.PI * 6;
      const r = 0.04 + (i / 200) * 0.22;
      pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0));
    }
    const hs = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 240, 0.007, 6), new THREE.MeshPhysicalMaterial({ color: 0x4477aa, metalness: 0.9, roughness: 0.3 }));
    hs.position.z = 0.08;
    cage.add(hs);
  }
  // escape wheel (small)
  const esc = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.02, 15), M.goldPolished);
  esc.rotation.x = Math.PI / 2; esc.position.set(0.2, -0.14, -0.02);
  cage.add(esc);
  // center jewel
  const jewel = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 16), new THREE.MeshPhysicalMaterial({ color: 0xaa1133, metalness: 0.4, roughness: 0.1, envMapIntensity: 2 }));
  jewel.position.z = 0.10; cage.add(jewel);
  grp.add(cage);
  tourbillonCage = cage;
  grp.position.set(AP.x, AP.y, 0.16);
  P('tourbillon', grp);
}
/* crystal — box-domed sapphire */
{
  const dome = latheZ([[1.74, 0.58], [1.72, 0.66], [1.45, 0.74], [0.9, 0.78], [0, 0.79]], M.glass, 96);
  dome.renderOrder = 10;
  P('crystal', dome);
}
/* crown + pushers */
{
  const grp = new THREE.Group();
  const crown = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.24, 32), M.titaniumPolished);
  body.rotation.z = Math.PI / 2;
  crown.add(body);
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2;
    const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.04, 0.05), M.titaniumPolished);
    ridge.position.set(0, Math.cos(a) * 0.26, Math.sin(a) * 0.26);
    ridge.rotation.x = -a;
    crown.add(ridge);
  }
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.20, 0.05, 32), M.goldPolished);
  cap.rotation.z = Math.PI / 2; cap.position.x = 0.15; crown.add(cap);
  crown.position.set(2.40, 0, -0.20);
  grp.add(crown);
  // crown guards (occlude the through-glass sightline)
  for (const sy of [1, -1]) {
    const guard = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.14, 0.34), M.titanium);
    guard.position.set(2.06, sy * 0.34, -0.20);
    guard.rotation.z = -sy * 0.5;
    grp.add(guard);
  }
  for (const sy of [1, -1]) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 0.34, 24), M.titaniumPolished);
    p.rotation.z = Math.PI / 2;
    p.position.set(2.18, sy * 0.95, -0.05);
    p.rotation.y = -sy * 0.42;
    grp.add(p);
  }
  P('crown', grp);
}
/* strap */
function strapSide(sign) {
  // segments laid along an arc curving away from the viewer
  const grp = new THREE.Group();
  const N = 8, R = 3.4, y0 = 2.5, step = 0.176;
  const stitchMat = new THREE.MeshStandardMaterial({ color: 0xb08a2e, metalness: 0.7, roughness: 0.4 });
  for (let i = 0; i < N; i++) {
    const t = i / N;
    const phi = (i + 0.5) * step;
    const link = new THREE.Mesh(new THREE.BoxGeometry(1.46 - t * 0.28, 0.60, 0.20), M.strap);
    link.position.set(0, sign * (y0 + R * Math.sin(phi)), -0.12 + R * (Math.cos(phi) - 1));
    link.rotation.x = -sign * phi;
    const st = new THREE.Mesh(new THREE.BoxGeometry(1.30 - t * 0.28, 0.035, 0.008), stitchMat);
    st.position.z = 0.10; link.add(st);
    grp.add(link);
  }
  return grp;
}
P('strapTop', strapSide(1));
P('strapBottom', strapSide(-1));

/* ---------- gold dust ---------- */
let dust;
{
  const N = 900;
  const pos = new Float32Array(N * 3), seed = [];
  for (let i = 0; i < N; i++) {
    // deterministic pseudo-random
    const r1 = Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1;
    const r2 = Math.abs(Math.sin(i * 78.233) * 12578.1459) % 1;
    const r3 = Math.abs(Math.sin(i * 39.425) * 26183.7423) % 1;
    seed.push([r1, r2, r3]);
    pos[i * 3] = (r1 - 0.5) * 14;
    pos[i * 3 + 1] = (r2 - 0.5) * 9;
    pos[i * 3 + 2] = (r3 - 0.5) * 8 - 1;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const sprite = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,225,150,1)'); gr.addColorStop(0.35, 'rgba(230,185,90,0.55)'); gr.addColorStop(1, 'rgba(200,160,60,0)');
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
  })();
  dust = new THREE.Points(g, new THREE.PointsMaterial({
    size: 0.085, map: sprite, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  }));
  dust.userData.seed = seed;
  dust.userData.base = pos.slice();
  scene.add(dust);
}
function driftDust(t) {
  const pos = dust.geometry.attributes.position;
  const base = dust.userData.base, seed = dust.userData.seed;
  for (let i = 0; i < seed.length; i++) {
    const [r1, r2, r3] = seed[i];
    const phase = t * Math.PI * 2;
    pos.array[i * 3] = base[i * 3] + Math.sin(phase + r1 * 6.28) * 0.35;
    pos.array[i * 3 + 1] = base[i * 3 + 1] + ((t * (0.4 + r2 * 0.7) + r3) % 1 - 0.5) * 1.6;
    pos.array[i * 3 + 2] = base[i * 3 + 2] + Math.cos(phase + r2 * 6.28) * 0.3;
  }
  pos.needsUpdate = true;
}

/* ---------- explosion definitions ---------- */
const EXPLODE = {
  crystal:    { d: [0, 0.25, 3.4],  rot: [0.25, 0, 0],   w: [0.72, 1.0] },
  bezel:      { d: [0, 0.1, 2.55],  rot: [0, 0, 0.6],    w: [0.62, 0.95] },
  hands:      { d: [0, -0.1, 1.9],  rot: [0, 0, 1.4],    w: [0.52, 0.88] },
  dial:       { d: [0, 0.15, 1.25], rot: [0, 0, -0.25],  w: [0.42, 0.82] },
  tourbillon: { d: [0.85, -0.7, 1.7], rot: [0, 0, 2.2],  w: [0.34, 0.78] },
  gear0:      { d: [1.7, 1.3, 0.9], rot: [0, 0, 3.0],    w: [0.2, 0.7] },
  gear1:      { d: [-1.9, 0.9, 0.7], rot: [0, 0, -2.6],  w: [0.24, 0.72] },
  gear2:      { d: [-1.2, -1.5, 0.55], rot: [0, 0, 2.2], w: [0.28, 0.74] },
  gear3:      { d: [2.0, -1.1, 0.75], rot: [0, 0, -3.2], w: [0.22, 0.7] },
  gear4:      { d: [0.4, 2.1, 0.6], rot: [0, 0, 2.8],    w: [0.26, 0.73] },
  mainspring: { d: [-0.7, 2.0, 1.0], rot: [0, 0, -1.8],  w: [0.3, 0.76] },
  movement:   { d: [0, 0, -0.7],    rot: [0, 0, 0.4],    w: [0.3, 0.72] },
  rotor:      { d: [0.3, -0.4, -1.5], rot: [0, 0, -2.4], w: [0.24, 0.68] },
  caseBack:   { d: [0, 0.1, -2.5],  rot: [0.2, 0, 0],    w: [0.16, 0.62] },
  caseBody:   { d: [0, 0, 0],       rot: [0, 0, 0],      w: [0, 1] },
  crown:      { d: [2.4, 0, 0.3],   rot: [0.9, 0, 0],    w: [0.4, 0.8] },
  strapTop:   { d: [0, 2.6, -0.6],  rot: [-0.35, 0, 0],  w: [0.08, 0.55] },
  strapBottom:{ d: [0, -2.6, -0.6], rot: [0.35, 0, 0],   w: [0.08, 0.55] },
};
const easeIO = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function setExplosion(p) { // p: 0 = fully exploded, 1 = assembled
  for (const [name, spec] of Object.entries(EXPLODE)) {
    const obj = parts[name]; if (!obj) continue;
    const [w0, w1] = spec.w;
    const local = Math.min(1, Math.max(0, (p - w0) / (w1 - w0)));
    const k = 1 - easeIO(local); // 1 = displaced
    const home = obj.userData.home;
    obj.position.set(home.p.x + spec.d[0] * k, home.p.y + spec.d[1] * k, home.p.z + spec.d[2] * k);
    obj.rotation.set(home.r.x + spec.rot[0] * k, home.r.y + spec.rot[1] * k, home.r.z + spec.rot[2] * k);
  }
}

/* ---------- sequences ---------- */
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const lerpV = (a, b, t) => a.clone().lerp(b, t);

const SEQ = {
  /* 1 — HERO ORBIT: smooth 360° turntable, floating in black void */
  hero(t) {
    dust.visible = true;
    setExplosion(1);
    watchGroup.rotation.set(0.10, t * Math.PI * 2, 0);
    watchGroup.position.set(0, Math.sin(t * Math.PI * 2) * 0.08, 0);
    tourbillonCage.rotation.z = -t * Math.PI * 4;
    tourbillonCage.userData.balance.rotation.z = Math.sin(t * Math.PI * 24) * 0.9;
    driftDust(t);
    camera.fov = 33; camera.position.set(0, 0.35, 9.2);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    rimL.position.set(-6, 2.5, -4); rimR.position.set(6.5, 3, -3.5);
    renderer.toneMappingExposure = 1.5;
  },

  /* 2 — MACRO FLY-THROUGH: glide across the dial to the tourbillon */
  macro(t) {
    dust.visible = false;
    setExplosion(1);
    watchGroup.rotation.set(0.0, 0.0, 0.0);
    watchGroup.position.set(0, 0, 0);
    tourbillonCage.rotation.z = -t * Math.PI * 5;
    tourbillonCage.userData.balance.rotation.z = Math.sin(t * Math.PI * 30) * 0.9;
    const posCurve = new THREE.CatmullRomCurve3([
      V3(-1.5, 1.35, 1.85), V3(-0.35, 1.62, 1.45), V3(0.55, 0.45, 1.35),
      V3(0.30, -0.45, 1.35), V3(0.02, -0.95, 1.42),
    ], false, 'centripetal', 0.5);
    const tgtCurve = new THREE.CatmullRomCurve3([
      V3(-0.9, 0.95, 0.30), V3(0.0, 1.45, 0.30), V3(0.25, 0.0, 0.35),
      V3(0.05, -0.7, 0.20), V3(0.0, -0.95, 0.16),
    ], false, 'centripetal', 0.5);
    camera.fov = 27;
    camera.position.copy(posCurve.getPoint(easeIO(t) * 0.999));
    camera.lookAt(tgtCurve.getPoint(easeIO(t) * 0.999));
    camera.updateProjectionMatrix();
    // light rippling across brushed metal
    const la = t * Math.PI * 2.2;
    rimL.position.set(Math.cos(la) * -6, 2.5 + Math.sin(la) * 2.5, -4 + Math.sin(la) * 2);
    rimR.position.set(6.5, 3 - Math.sin(la) * 2, -3.5 + Math.cos(la) * 2.5);
    key.position.set(Math.sin(la * 0.7) * 4, 5, 6);
    key.intensity = 2.8;
    renderer.toneMappingExposure = 1.62;
  },

  /* 3 — EXPLODED ASSEMBLY: parts converge into the finished watch */
  exploded(t) {
    dust.visible = true;
    driftDust(t * 0.6);
    watchGroup.rotation.set(0.12, -0.55 + easeIO(t) * 0.55, 0);
    watchGroup.position.set(0, 0, 0);
    setExplosion(t);
    tourbillonCage.rotation.z = -t * Math.PI * 6;
    tourbillonCage.userData.balance.rotation.z = Math.sin(t * Math.PI * 20) * 0.9;
    const cp = lerpV(V3(3.6, 2.0, 9.6), V3(0, 0.4, 9.4), easeIO(t));
    camera.fov = 35;
    camera.position.copy(cp);
    camera.lookAt(0, 0, 0.4);
    camera.updateProjectionMatrix();
    rimL.position.set(-6, 2.5, -4); rimR.position.set(6.5, 3, -3.5);
    renderer.toneMappingExposure = 1.45;
  },
};

/* ---------- driver API for Playwright ---------- */
window.renderFrame = (seq, t, q = 0.7) => {
  key.intensity = 2.2; // macro overrides
  SEQ[seq](t);
  renderer.render(scene, camera);
  outCtx.drawImage(renderer.domElement, 0, 0, W, H); // supersample -> downscale
  return outCanvas.toDataURL('image/jpeg', q);
};
window.__parts = parts; // debug access
window.__scene = scene; window.__camera = camera;
window.rigReady = true;
</script>
